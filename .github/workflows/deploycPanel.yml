name: Deploy Laravel App via FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, pdo_mysql, fileinfo, gd

      - name: Install dependencies & build
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader
          npm ci
          npm run build

      - name: Deploy Laravel to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./               # Root Laravel project
          server-dir: /public_html/   # Sesuaikan dengan folder di hosting
          exclude: |
            **/vendor/**
            **/node_modules/**
            storage/
            tests/
            .git*
            .env
